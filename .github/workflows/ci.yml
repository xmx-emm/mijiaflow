name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Ensure the committed bundle matches the source
        run: git diff --exit-code -- mcp/dist
      - name: Check the publishable tarball contents
        run: npm pack --dry-run
